---
apps:
  - name: herring
    domain: "{{ domain | default('xn--led-bza2n.mleczki.pl') }}"
    http_port: 8081
    tracker_public_port: "{{ tracker_public_port }}"
    image: "ghcr.io/mleczakm/herring:{{ app_version | default('latest') }}"
    data_volume: herring-data
    data_path: /data
    env:
      HERRING_ENV: production
      HERRING_HTTP_ADDR: ":8080"
      HERRING_TRACKER_ADDR: ":8090"
      HERRING_DATABASE_PATH: /data/herring.db
    ipv6: "{{ mikrus_ipv6 }}"
    cytrus_host: "{{ cytrus_host }}"
    proxied: true
