<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" fill="none">
  <title>Schemat Zatoki Gdańskiej z przykładowym śladem między Gdynią a Helem</title>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#75999a" stroke-opacity=".26"/>
      <path d="M22 24h4m-2-2v4" stroke="#75999a" stroke-opacity=".28"/>
    </pattern>
    <pattern id="land" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="7" height="7" fill="#294448"/><path d="M0 0v7" stroke="#476367" stroke-width="1.2"/>
    </pattern>
    <path id="shore" d="M-30-18H87C108 5 129 21 156 27s52 14 76 29l64 45c17 11 34 19 51 33l24 18q9 10-1 12c-9 1-16-7-24-9-18-7-32-26-51-35l-35-21c-20-10-34-24-58-29l-45-17c-15-7-27-6-40-15-11-7-18-3-23 8-6 13-17 17-16 29s16 23 10 38c-3 11-11 16-9 30l10 29 19 20 7 19 17 11-1 10-16-5 7 10 14 1 15 19 8 26 17 12c10 12 8 29 20 42 21 21 38 26 63 30l20 5 14-5 16-9 16 4 12 12 35 6c31 3 58-8 84-11 49-7 80-23 119-24l106-26v112H-30Z"/>
