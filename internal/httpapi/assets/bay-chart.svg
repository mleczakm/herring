    <use href="#shore" stroke-width="98" opacity=".24"/><use href="#shore" stroke="#152e33" stroke-width="96"/>
    <use href="#shore" stroke-width="66" opacity=".32"/><use href="#shore" stroke="#152e33" stroke-width="64"/>
    <use href="#shore" stroke-width="40" opacity=".42"/><use href="#shore" stroke="#152e33" stroke-width="38"/>
    <use href="#shore" stroke-width="19" opacity=".48"/><use href="#shore" stroke="#152e33" stroke-width="17"/>
    <use href="#shore" fill="url(#land)" stroke="#719091" stroke-width="1.5"/>
  </g>
  <rect width="640" height="410" fill="url(#grid)"/>
  <g font-family="monospace" fill="#d2dfda" font-size="13" letter-spacing="1.6">
    <text x="29" y="208">GDYNIA</text><text x="93" y="351">GDAŃSK</text><text x="339" y="126">HEL</text>
    <text x="365" y="303" fill="#a0bab9" letter-spacing="3">ZATOKA GDAŃSKA</text>
  </g>
  <g stroke="#ff835b" stroke-linejoin="round">
    <path d="m121 219 42 14 40-4 37 11 36-6 25-24 39-10 21-24 31-8" stroke-width="3.6"/>
    <g fill="#172e31" stroke-width="2"><circle cx="121" cy="219" r="5"/><circle cx="203" cy="229" r="3"/><circle cx="276" cy="234" r="3"/><circle cx="340" cy="200" r="3"/></g>
    <circle cx="392" cy="168" r="36" fill="#ff835b" fill-opacity=".055" stroke-opacity=".32"/>
    <circle cx="392" cy="168" r="22" fill="#ff835b" fill-opacity=".1" stroke-opacity=".65"/>
    <circle cx="392" cy="168" r="7" fill="#ff835b" stroke="#ffdfc6" stroke-width="2"/>
    <path d="m410 151 23-22h15" stroke-opacity=".8"/>
  </g>
  <rect x="448" y="114" width="89" height="30" rx="5" fill="#ff835b"/>
  <text x="492" y="134" fill="#172e31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" letter-spacing="1">ST-901</text>
